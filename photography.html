<style>
  :root {
    color-scheme: light;
    --wall: #f6f4ef;
    --ink: #222019;
    --muted: #7b766b;
    --glow: rgba(255,255,255,.95);
    --hair: rgba(34,32,25,.15);
    --bar: rgba(34,32,25,.6);
    --sh: 30,25,15;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --wall: #141310; --ink: #ece8df; --muted: #9a958a; --glow: rgba(255,244,222,.07); --hair: rgba(236,232,223,.16); --bar: rgba(236,232,223,.5); --sh: 0,0,0; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --wall: #141310; --ink: #ece8df; --muted: #9a958a; --glow: rgba(255,244,222,.07); --hair: rgba(236,232,223,.16); --bar: rgba(236,232,223,.5); --sh: 0,0,0; }
  html.theme-fade, html.theme-fade *:not(.theme):not(.theme *) { transition: background-color .5s ease, color .5s ease, border-color .5s ease !important; }
  .theme { position: fixed; top: 1rem; right: 1.2rem; z-index: 5; display: inline-flex; align-items: center; justify-content: center; width: 2.2rem; height: 2.2rem; padding: 0; background: transparent; color: var(--muted); border: 1px solid var(--hair); border-radius: 50%; cursor: pointer; transition: border-color .2s, color .2s, transform .3s; }
  .theme:hover, .theme:focus-visible { border-color: var(--ink); color: var(--ink); transform: rotate(20deg); outline: none; }
  .theme svg { width: 18px; height: 18px; }
  .theme .rays { transform-origin: 12px 12px; transition: transform .95s cubic-bezier(.4, 0, .2, 1); }
  .theme .rays line { transform-origin: 12px 12px; transition: transform .7s cubic-bezier(.3, 0, .2, 1), opacity .7s ease; transition-delay: calc(var(--i) * 35ms); }
  .theme .sweep { fill: currentColor; stroke: none; }
  .theme .sweep { transform: translate(7px,-7px); transition: transform .8s cubic-bezier(.45,0,.2,1); }
  .theme[data-mode="dark"] .sweep { transform: translate(0,0); transition: transform .8s cubic-bezier(.45,0,.2,1) .17s; }
  .theme[data-mode="dark"] .rays { transform: rotate(45deg); }
  .theme[data-mode="dark"] .rays line { transform: scale(.5); opacity: 0; transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .5s ease; transition-delay: calc(var(--i) * 30ms); }
  @media (prefers-reduced-motion: reduce) { .theme *, .theme { transition: none !important; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--sans); font-weight: 300; overflow-x: hidden;
    background:
      radial-gradient(ellipse 90% 40rem at 50% -6rem, var(--glow), transparent 70%),
      var(--wall);
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(1.25rem, 5vw, 4rem); }

  /* Opening wall text */
  .intro { text-align: center; padding: clamp(2rem, 5vw, 3.5rem) 0 clamp(2rem, 5vw, 3rem); }
  .intro .eyebrow { margin: 0 0 1.4rem; font-size: .72rem; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
  .intro h1 { margin: 0; font-family: var(--serif); font-weight: 300; font-size: clamp(3rem, 9vw, 6.5rem); line-height: 1; letter-spacing: .01em; }
  .intro .rule-unused { width: 3rem; height: 1px; background: var(--ink); opacity: .5; margin: 2rem auto 1.6rem; }
  .intro .statement { margin: 0 auto; max-width: 34ch; font-family: var(--serif); font-style: italic; font-size: clamp(1.15rem, 2.4vw, 1.4rem); line-height: 1.5; color: var(--muted); }

  .intro { padding-bottom: clamp(1.2rem, 3vw, 1.8rem); }
  .about { max-width: 40rem; margin: 0 auto; padding: clamp(2rem, 4vw, 3rem) 0 clamp(2.5rem, 5vw, 3.5rem); text-align: center; border-top: 1px solid var(--hair); }
  .about h2 { margin: 0 0 1.1rem; font-family: var(--sans); font-weight: 400; font-size: .72rem; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
  .about p { margin: 0; font-family: var(--serif); font-size: clamp(1.15rem, 2.4vw, 1.4rem); line-height: 1.6; color: var(--ink); }
  .intro .bar { position: relative; width: min(18rem, 64vw); height: 1px; margin: clamp(1.2rem, 3vw, 1.7rem) auto 0; }
  .intro .bar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--bar) 30%, var(--bar) 70%, transparent); }
  .tabs { display: flex; justify-content: center; gap: .4rem clamp(1.25rem, 4.5vw, 3.25rem); flex-wrap: wrap; padding-bottom: clamp(1.5rem, 3.5vw, 2.4rem); }
  .tab { appearance: none; background: none; border: 0; padding: .4rem 0; cursor: pointer; font-family: var(--serif); font-size: clamp(1.15rem, 2.6vw, 1.45rem); font-style: italic; color: var(--muted);
    background-image: linear-gradient(var(--ink), var(--ink)); background-repeat: no-repeat; background-position: 50% 100%; background-size: 0 1px; transition: color .3s, background-size .35s ease; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); background-size: 100% 1px; }
  .tab:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }
  .gallery[hidden] { display: none; }
  .gallery { animation: hang .6s ease both; outline: none; }
  @keyframes hang { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* The hang: everything shares one eye line */
  .gallery { display: flex; flex-wrap: wrap; gap: 1.1rem; align-items: flex-start; padding-bottom: clamp(2rem, 5vw, 3.5rem); }
  .exhibit { margin: 0; flex: var(--arn) 1 calc(var(--arn) * 13rem); max-width: calc(var(--arn) * 20rem); min-width: 0; }
  .frame { box-shadow: 0 2px 4px rgba(var(--sh),.10), 0 14px 30px -12px rgba(var(--sh),.28); transition: box-shadow .5s ease, transform .5s ease; }
  .exhibit:hover .frame { transform: translateY(-3px); box-shadow: 0 1px 1px rgba(var(--sh),.12), 0 16px 30px -8px rgba(var(--sh),.26), 0 40px 64px -24px rgba(var(--sh),.28); }
  .photo { display: block; width: 100%; aspect-ratio: var(--ar, 4/5); object-fit: cover; }
  img.photo { height: auto; }
  .ph { display: grid; place-items: center; color: rgba(255,255,255,.55); background: linear-gradient(165deg, #cfcbc2, #aaa59a); }
  .ph svg { width: 2.6rem; height: 2.6rem; }

  .frame { cursor: zoom-in; }
  .frame:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }

  /* Lightbox */
  dialog.lb { border: 0; padding: 0; margin: 0; max-width: none; max-height: none; width: 100vw; height: 100vh; height: 100dvh; background: transparent; color: #f3f0e9; overflow: hidden; }
  dialog.lb::backdrop { background: rgba(14,12,8,.88); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  dialog.lb[open] { display: flex; flex-direction: column; align-items: center; justify-content: center; animation: lbIn .3s ease both; }
  @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
  .lb-stage { display: block; }
  .lb-stage > * { display: block; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .lb-stage > .ph { display: grid; }
  .lb-stage > * { max-width: none; }
  .lb-stage img { aspect-ratio: auto; object-fit: contain; }
  .lb-cap { margin-top: 1.1rem; text-align: center; display: flex; flex-direction: column; gap: .1rem; }
  .lb-cap .t { font-size: 1.25rem; color: #f3f0e9; }
  .lb-cap .m { color: #b9b3a6; }
  .lb-cap .y { color: #b9b3a6; }
  .lb-btn { position: absolute; background: none; border: 0; color: #f3f0e9; cursor: pointer; font-family: var(--serif); line-height: 1; opacity: .7; transition: opacity .2s; padding: .6rem .9rem; }
  .lb-btn:hover, .lb-btn:focus-visible { opacity: 1; outline: none; }
  .lb-close { top: 1rem; right: 1.2rem; font-size: 2.6rem; }
  .lb-prev, .lb-next { top: 50%; transform: translateY(-50%); font-size: 3rem; }
  .lb-prev { left: .6rem; } .lb-next { right: .6rem; }
  @media (max-width: 48rem) { .lb-prev, .lb-next { top: auto; bottom: 1rem; transform: none; } }
  @media (prefers-reduced-motion: reduce) { dialog.lb[open] { animation: none; } }

  /* Wall label */
  /* Camera and lens details only appear in the enlarged view */
  .exhibit figcaption { display: none; }
  .m { display: block; font-family: var(--serif); font-style: italic; font-size: .85rem; color: var(--muted); line-height: 1.3; }


  footer { text-align: center; padding: 0 0 3.5rem; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 40rem) {
    .gallery { gap: 1.25rem 0; }
    .exhibit { flex: 1 1 100%; max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .gallery { animation: none; } .tab { transition: none; } .frame { transition: none; } .exhibit:hover .frame { transform: none; } }
</style>
</head>

</dialog>

<script>
  (function () {
    var root = document.documentElement, btn = document.getElementById('themeBtn');
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches, tm;
    function isDark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : mq.matches; }
    function label() { var d = isDark(); btn.setAttribute('data-mode', d ? 'dark' : 'light'); btn.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode'); }
    function fade() { if (reduce) return; root.classList.add('theme-fade'); clearTimeout(tm); tm = setTimeout(function () { root.classList.remove('theme-fade'); }, 700); }
    btn.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark'; fade(); root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {} label();
    });
    if (mq.addEventListener) mq.addEventListener('change', function () { fade(); label(); });
    label();
  })();
</script>
<script>
  (function () {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
    function show(name, focus) {
      tabs.forEach(function (t) {
        var on = t.getAttribute('data-tab') === name;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
        document.getElementById('panel-' + t.getAttribute('data-tab')).hidden = !on;
        if (on && focus) t.focus();
      });
      try { history.replaceState(null, '', '#' + name); } catch (e) {}
    }
    tabs.forEach(function (t, i) {
      t.addEventListener('click', function () { show(t.getAttribute('data-tab')); });
      t.addEventListener('keydown', function (e) {
        var n = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : null;
        if (n === null) return;
        e.preventDefault();
        show(tabs[(n + tabs.length) % tabs.length].getAttribute('data-tab'), true);
      });
    });
    var h = location.hash.slice(1);
    if (['people', 'environments', 'cars', 'animals'].indexOf(h) > -1) show(h);
  })();
</script>

<script>
  (function () {
    var lb = document.getElementById('lb'), stage = document.getElementById('lbStage'), cap = document.getElementById('lbCap');
    var list = [], idx = 0;
    var curW = 3, curH = 2;
    // Size the photo to fit the screen while keeping its exact proportions
    function fit() {
      var el = stage.firstElementChild; if (!el) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      var k = Math.min(vw * 0.92 / curW, vh * 0.78 / curH);
      el.style.width = Math.round(curW * k) + 'px';
      el.style.height = Math.round(curH * k) + 'px';
    }
    function fill() {
      var ex = list[idx];
      var photo = ex.querySelector('.photo').cloneNode(true);
      if (photo.tagName === 'IMG') {
        photo.classList.remove('ph');
        curW = +photo.getAttribute('width') || photo.naturalWidth || 3;
        curH = +photo.getAttribute('height') || photo.naturalHeight || 2;
        photo.removeAttribute('loading');
      } else {
        var ar = (ex.getAttribute('style').match(/--ar:\s*([\d.]+)\s*\/\s*([\d.]+)/) || [0, 3, 2]);
        curW = +ar[1]; curH = +ar[2];
        photo.className = 'photo ph';
      }
      photo.style.aspectRatio = 'auto';
      stage.innerHTML = '';
      stage.appendChild(photo);
      fit();
      cap.innerHTML = ex.querySelector('figcaption').innerHTML;
    }
    window.addEventListener('resize', fit);
    function open(ex) {
      var panel = ex.closest('.gallery');
      list = Array.prototype.slice.call(panel.querySelectorAll('.exhibit'));
      idx = list.indexOf(ex);
      fill();
      if (!lb.open) lb.showModal();
    }
    function step(d) { idx = (idx + d + list.length) % list.length; fill(); }
    document.querySelectorAll('.exhibit .frame').forEach(function (f) {
      f.addEventListener('click', function () { open(f.closest('.exhibit')); });
      f.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(f.closest('.exhibit')); } });
    });
    lb.querySelector('.lb-close').addEventListener('click', function () { lb.close(); });
    lb.querySelector('.lb-prev').addEventListener('click', function () { step(-1); });
    lb.querySelector('.lb-next').addEventListener('click', function () { step(1); });
    // Clicking the dim area (anywhere that is not the photo or a button) closes it
    lb.addEventListener('click', function (e) { if (e.target === lb || e.target === cap) lb.close(); });
    lb.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    });
  })();
</script>
